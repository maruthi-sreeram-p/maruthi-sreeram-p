<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-label="Animated futuristic Java backend developer profile">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#040612"/>
    <stop offset="0.52" stop-color="#0A0F24"/>
    <stop offset="1" stop-color="#180A29"/>
  </linearGradient>
  <linearGradient id="violetCyan" x1="0" x2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="violetGold" x1="0" x2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <radialGradient id="core">
    <stop offset="0" stop-color="#8B5CF6" stop-opacity=".75"/>
    <stop offset=".45" stop-color="#31205F" stop-opacity=".38"/>
    <stop offset="1" stop-color="#0A0F24" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#26304A" stroke-opacity=".22"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>

<rect width="1400" height="520" rx="28" fill="url(#bg)"/>
<rect x="18" y="18" width="1364" height="484" rx="24" fill="url(#grid)" stroke="#8B5CF6" stroke-opacity=".62"/>

<!-- ambient glows -->
<circle cx="1110" cy="250" r="160" fill="url(#core)"/>
<circle cx="1110" cy="250" r="105" fill="none" stroke="#8B5CF6" stroke-opacity=".34">
  <animate attributeName="r" values="105;125;105" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- scan line -->
<rect x="70" y="82" width="660" height="2" fill="#22D3EE" opacity=".8" filter="url(#glow)">
  <animate attributeName="y" values="82;360;82" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- moving signal path -->
<path d="M80 392 C260 360, 430 430, 630 394 S860 350, 1030 370" fill="none" stroke="url(#violetGold)" stroke-width="2" opacity=".7"/>
<circle r="7" fill="#F59E0B" filter="url(#glow)">
  <animateMotion dur="4.5s" repeatCount="indefinite" path="M80 392 C260 360, 430 430, 630 394 S860 350, 1030 370"/>
</circle>

<!-- left content -->
<g font-family="monospace">
  <text x="72" y="78" fill="#22D3EE" font-size="16" letter-spacing="5">JAVA BACKEND DEVELOPER</text>
  <text x="72" y="145" fill="#FFFFFF" font-size="52" font-weight="700">MARUTHI SREERAM</text>
  <text x="74" y="184" fill="#B7C0D8" font-size="17">Spring Boot • Microservices • Distributed Systems</text>
  <text x="74" y="214" fill="#F59E0B" font-size="15">AI &amp; BACKEND ENGINEERING</text>

  <text x="74" y="270" fill="#8B5CF6" font-size="13">BUILD</text>
  <text x="132" y="270" fill="#B7C0D8" font-size="13">→</text>
  <text x="154" y="270" fill="#22D3EE" font-size="13">DEBUG</text>
  <text x="225" y="270" fill="#B7C0D8" font-size="13">→</text>
  <text x="247" y="270" fill="#F59E0B" font-size="13">SHIP</text>
  <text x="301" y="270" fill="#B7C0D8" font-size="13">→</text>
  <text x="323" y="270" fill="#8B5CF6" font-size="13">IMPROVE</text>

  <text x="74" y="316" fill="#AAB4C8" font-size="13">B.Tech Computer Science · Class of 2027</text>
  <text x="74" y="340" fill="#AAB4C8" font-size="13">Production-oriented backend systems and AI-powered applications</text>

  <rect x="70" y="382" width="540" height="70" rx="16" fill="#080D1B" stroke="#273455"/>
  <text x="94" y="411" fill="#22D3EE" font-size="11" letter-spacing="2">ENGINEERING PRINCIPLE</text>
  <text x="94" y="435" fill="#FFFFFF" font-size="14">Understand the system. Build it. Break it. Improve it.</text>
</g>

<!-- right HUD -->
<g font-family="monospace">
  <circle cx="1110" cy="250" r="78" fill="#070B18" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="1110" cy="250" r="92" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1110 250" to="360 1110 250" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="250" r="112" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 15">
    <animateTransform attributeName="transform" type="rotate" from="360 1110 250" to="0 1110 250" dur="18s" repeatCount="indefinite"/>
  </circle>

  <text x="1110" y="245" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">JAVA</text>
  <text x="1110" y="265" text-anchor="middle" fill="#8B5CF6" font-size="10" letter-spacing="2">SYSTEM CORE</text>

  <circle cx="1015" cy="205" r="5" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M0 0 C45 -35 140 0 190 45"/>
  </circle>
  <circle cx="1202" cy="295" r="5" fill="#F59E0B" filter="url(#glow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M0 0 C-45 35 -125 -10 -185 -45"/>
  </circle>

  <text x="950" y="92" fill="#22D3EE" font-size="10" letter-spacing="2">PROFILE TELEMETRY</text>

  <text x="950" y="126" fill="#8B5CF6" font-size="24" font-weight="700">18</text>
  <text x="990" y="126" fill="#9AA6BE" font-size="11">REPOS</text>

  <text x="1080" y="126" fill="#22D3EE" font-size="24" font-weight="700">26</text>
  <text x="1120" y="126" fill="#9AA6BE" font-size="11">FOLLOWERS</text>

  <text x="1220" y="126" fill="#F59E0B" font-size="24" font-weight="700">1</text>
  <text x="1245" y="126" fill="#9AA6BE" font-size="11">STAR</text>

  <text x="950" y="430" fill="#9AA6BE" font-size="11">FOLLOWING</text>
  <text x="1040" y="430" fill="#FFFFFF" font-size="16">44</text>

  <rect x="950" y="452" width="310" height="3" rx="2" fill="url(#violetCyan)">
    <animate attributeName="width" values="310;245;310" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
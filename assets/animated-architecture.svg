<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-label="Animated system architecture using Java Spring Boot Kafka RabbitMQ Redis SQL and Spring AI">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#040612"/>
    <stop offset="1" stop-color="#10132B"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" x2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset=".5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#26304A" stroke-opacity=".2"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="610" rx="28" fill="url(#bg)"/>
<rect x="16" y="16" width="1368" height="578" rx="22" fill="url(#grid)" stroke="#8B5CF6" stroke-opacity=".62"/>

<text x="700" y="52" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="22" font-weight="700">SYSTEM ARCHITECTURE</text>
<text x="700" y="76" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" letter-spacing="3">ANIMATED DATA FLOW • JAVA BACKEND • AI</text>

<!-- pipes -->
<g fill="none" stroke="url(#flow)" stroke-width="3" opacity=".72">
  <path d="M165 185H385"/>
  <path d="M465 185H685"/>
  <path d="M765 185H985"/>
  <path d="M1065 185H1230"/>
  <path d="M425 245V400H260"/>
  <path d="M725 245V400H585"/>
  <path d="M1045 245V400H930"/>
  <path d="M1045 245V400H1240"/>
</g>

<!-- moving packets -->
<g fill="#F59E0B" filter="url(#glow)">
  <circle r="6"><animateMotion path="M165 185H385" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="6"><animateMotion path="M465 185H685" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle r="6"><animateMotion path="M765 185H985" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle r="6"><animateMotion path="M1065 185H1230" dur="2s" repeatCount="indefinite"/></circle>
  <circle r="5"><animateMotion path="M425 245V400H260" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle r="5"><animateMotion path="M725 245V400H585" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle r="5"><animateMotion path="M1045 245V400H930" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle r="5"><animateMotion path="M1045 245V400H1240" dur="2.5s" repeatCount="indefinite"/></circle>
</g>

<g font-family="monospace">
  <rect x="85" y="135" width="160" height="100" rx="16" fill="#080D1B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="165" y="174" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">CLIENT</text>
  <text x="165" y="198" text-anchor="middle" fill="#AAB4C8" font-size="11">React / Browser</text>

  <rect x="385" y="135" width="160" height="100" rx="16" fill="#080D1B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="465" y="174" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">API GATEWAY</text>
  <text x="465" y="198" text-anchor="middle" fill="#AAB4C8" font-size="11">REST / Security</text>

  <rect x="685" y="135" width="160" height="100" rx="16" fill="#080D1B" stroke="#22D3EE" stroke-width="2"/>
  <text x="765" y="174" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">SPRING BOOT</text>
  <text x="765" y="198" text-anchor="middle" fill="#AAB4C8" font-size="11">Service Layer</text>

  <rect x="985" y="135" width="160" height="100" rx="16" fill="#080D1B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1065" y="174" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">AI LAYER</text>
  <text x="1065" y="198" text-anchor="middle" fill="#AAB4C8" font-size="11">Spring AI</text>

  <rect x="1230" y="135" width="120" height="100" rx="16" fill="#080D1B" stroke="#22D3EE" stroke-width="2"/>
  <text x="1290" y="174" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">CACHE</text>
  <text x="1290" y="198" text-anchor="middle" fill="#AAB4C8" font-size="11">Redis</text>

  <rect x="155" y="400" width="210" height="104" rx="16" fill="#080D1B" stroke="#F59E0B" stroke-width="2"/>
  <text x="260" y="440" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">EVENT STREAM</text>
  <text x="260" y="466" text-anchor="middle" fill="#AAB4C8" font-size="11">Kafka / RabbitMQ</text>

  <rect x="480" y="400" width="210" height="104" rx="16" fill="#080D1B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="585" y="440" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">DATABASES</text>
  <text x="585" y="466" text-anchor="middle" fill="#AAB4C8" font-size="11">MySQL / PostgreSQL / MongoDB</text>

  <rect x="825" y="400" width="210" height="104" rx="16" fill="#080D1B" stroke="#22D3EE" stroke-width="2"/>
  <text x="930" y="440" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">INFRASTRUCTURE</text>
  <text x="930" y="466" text-anchor="middle" fill="#AAB4C8" font-size="11">Docker / Git / Linux</text>

  <rect x="1135" y="400" width="210" height="104" rx="16" fill="#080D1B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1240" y="440" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">ENGINEERING</text>
  <text x="1240" y="466" text-anchor="middle" fill="#AAB4C8" font-size="11">Reliability / Scale / Security</text>

  <text x="700" y="558" text-anchor="middle" fill="#AAB4C8" font-size="12">
    Java • Spring Boot • Kafka • RabbitMQ • Redis • SQL • Spring AI • Docker
  </text>
</g>
</svg>